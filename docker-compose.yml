# Local services for the SaaS Accounting app.
# Laravel itself runs on your machine (`composer run dev`); these containers
# provide the database, cache/queue and a fake mail inbox.
name: saas-platform

services:
  postgres:
    image: postgres:18.1-trixie
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust   # local development only
      POSTGRES_USER: postgres
      POSTGRES_DB: saas_platform
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saas_platform"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.4.0-alpine
    volumes:
      - redis-data:/data
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    ports:
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"

volumes:
  postgres-data:
  redis-data:
  mailpit-data:
